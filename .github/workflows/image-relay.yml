name: image-relay

on:
  workflow_dispatch:
  push:
    paths:
      - relay/pending.json

permissions:
  contents: write

concurrency:
  group: image-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download images
        run: node scripts/relay-download.js

      - name: Commit images + manifest
        run: |
          git config user.name "image-relay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add relay/images relay/manifest.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "relay: images $(date -u +%Y%m%d%H%M)"
            git push
          fi
